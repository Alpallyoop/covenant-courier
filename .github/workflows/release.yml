name: release (draft)

# Builds the release bundle on Windows with scripts/courier_build_release_v1.ps1 (ZIP of the commit,
# release manifest, sha256sums, clean-extract smoke of courier.ps1 verify and vtp2.ps1 verify) and
# attaches it to a DRAFT GitHub release. Publishing the draft stays a manual owner step.
# Run it from the Actions tab on main after the release branch has merged.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. v0.2.0-product-core"
        required: true
      supersedes:
        description: "Release tag this one supersedes (optional)"
        required: false
        default: "covenant-courier-v0.1.5-product-core"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and smoke-test the bundle
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          SUPERSEDES: ${{ inputs.supersedes }}
        run: |
          $ErrorActionPreference = "Continue"
          $a = @("-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File",".\scripts\courier_build_release_v1.ps1","-RepoRoot",".","-Version",$env:VERSION,"-OutDir",(Join-Path $env:RUNNER_TEMP "release"))
          if ($env:SUPERSEDES) { $a += @("-Supersedes",$env:SUPERSEDES) }
          & pwsh @a 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "build.log")
          if ($LASTEXITCODE -ne 0) { throw "release build exited $LASTEXITCODE" }
          if ((Get-Content -Raw (Join-Path $env:RUNNER_TEMP "build.log")) -notmatch "COVENANT_COURIER_RELEASE_BUILD_OK") { throw "release build token missing" }

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          $d = Join-Path $env:RUNNER_TEMP "release"
          $tag = "covenant-courier-" + $env:VERSION
          $sha = (Get-Content (Join-Path $d "sha256sums.txt") -TotalCount 1).Split(" ")[0]
          $notes = "Built by scripts/courier_build_release_v1.ps1 from $env:GITHUB_SHA. Clean-extract smoke passed (courier.ps1 verify, vtp2.ps1 verify). ZIP SHA-256: $sha. After unzipping run .\courier.ps1 verify-all (needs ssh-keygen and the .NET 10 SDK)."
          gh release create $tag --draft --prerelease --target $env:GITHUB_SHA --title $tag --notes $notes `
            (Join-Path $d ($tag + ".zip")) (Join-Path $d "release_manifest.json") (Join-Path $d "sha256sums.txt")
